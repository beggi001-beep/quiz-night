<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120a2e">
<title>Quiz Night – Showtime</title>
<style>
:root{--bg:#120a2e;--gold:#ffc83d;--pink:#ff3d81;--cyan:#33e1ff;--green:#2ee59d;--red:#ff4d4d;--muted:#b9b0e0;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#120a2e;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#3a1d8f 0%,#120a2e 60%) fixed}
body::before,body::after{content:"";position:fixed;top:-40vh;width:60vw;height:160vh;pointer-events:none;z-index:0;opacity:.13;
 background:linear-gradient(180deg,#fff 0%,transparent 75%);filter:blur(8px);transform-origin:50% 0}
body::before{left:-10vw;animation:beamL 7s ease-in-out infinite alternate;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
body::after{right:-10vw;animation:beamR 8s ease-in-out infinite alternate;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
@keyframes beamL{from{transform:rotate(-25deg)}to{transform:rotate(10deg)}}
@keyframes beamR{from{transform:rotate(25deg)}to{transform:rotate(-10deg)}}
body.tense::before,body.tense::after{background:linear-gradient(180deg,#ff4d4d 0%,transparent 75%);opacity:.22}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;padding:18px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:fadeIn .45s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.logo{font-size:clamp(46px,14vw,78px);font-weight:900;line-height:.9;letter-spacing:-2px;margin:0;
 background:linear-gradient(180deg,#fff6c9,#ffc83d 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 0 #8a2be2) drop-shadow(0 0 24px rgba(255,200,61,.45))}
.tag{color:var(--pink);font-weight:800;letter-spacing:6px;text-transform:uppercase;font-size:14px}
.marquee{display:flex;gap:10px;justify-content:center}
.marquee i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink 1s infinite}
.marquee i:nth-child(even){animation-delay:.5s}
@keyframes blink{50%{opacity:.2;box-shadow:none}}
.btn{appearance:none;border:0;border-radius:16px;padding:16px 22px;font-size:18px;font-weight:800;color:#1a0b3d;background:linear-gradient(180deg,#ffe07a,#ffb800);
 box-shadow:0 5px 0 #b27400,0 10px 24px rgba(255,184,0,.3);cursor:pointer;width:100%;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b27400}
.btn.pink{background:linear-gradient(180deg,#ff7aa8,#ff3d81);color:#fff;box-shadow:0 5px 0 #a3134a,0 10px 24px rgba(255,61,129,.3)}
.btn.ghost{background:var(--card);color:#fff;box-shadow:none;border:1px solid var(--line);font-weight:700}
.btn.small{padding:10px 14px;font-size:15px;width:auto}
h2{margin:6px 0 14px;font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prow .av{font-size:26px;width:36px;text-align:center}
.prow input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font-size:17px}
.prow button{border:0;background:none;color:var(--muted);font-size:22px;padding:6px;cursor:pointer}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.opt label{font-size:16px}
select{padding:10px;border-radius:10px;border:1px solid var(--line);background:#24145a;color:#fff;font-size:15px;max-width:60%}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#3b2d75;border-radius:30px;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(22px)}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;color:#fff;white-space:nowrap}
.chip.gold{background:linear-gradient(180deg,#ffe07a,#ffb800);color:#1a0b3d;border:0;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.catbox{text-align:center;margin:6px 0 10px}
.cat{display:inline-block;padding:8px 18px;border-radius:999px;font-weight:900;letter-spacing:3px;text-transform:uppercase;font-size:14px;background:var(--pink)}
.cat.spin{animation:jitter .08s infinite}
@keyframes jitter{50%{transform:translateY(-2px) scale(1.04)}}
.timer{position:relative;width:86px;height:86px;margin:4px auto 10px}
.timer svg{transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:8}
.timer .bg{stroke:rgba(255,255,255,.12)}
.timer .fg{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.timer.danger .fg{stroke:var(--red)}
.timer.danger b{color:var(--red);animation:pulse .5s infinite}
.question{font-size:clamp(21px,5.6vw,27px);font-weight:800;line-height:1.25;text-align:center;margin:4px 0 18px;min-height:3em}
.answers{display:grid;gap:11px}
.ans{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 14px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-weight:700;cursor:pointer;transition:transform .1s,background .2s,border-color .2s;opacity:0;transform:translateX(-20px)}
.ans.in{opacity:1;transform:none;transition:opacity .35s,transform .35s,background .2s,border-color .2s}
.ans .L{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);font-weight:900}
.ans.picked{border-color:var(--gold);background:rgba(255,200,61,.18)}
.ans.picked.suspense{animation:glow .4s infinite alternate}
@keyframes glow{to{box-shadow:0 0 22px var(--gold);background:rgba(255,200,61,.32)}}
.ans.right{border-color:var(--green);background:rgba(46,229,157,.28);animation:pop .4s}
.ans.wrong{border-color:var(--red);background:rgba(255,77,77,.28)}
.ans.dim{opacity:.35}
.ans:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.05)}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.confirm{display:none;gap:10px;margin-top:14px}
.confirm.show{display:flex}
.confirm .btn{flex:1}
.banner{text-align:center;font-size:22px;font-weight:900;margin-top:14px;min-height:30px}
.banner.good{color:var(--green)}.banner.bad{color:var(--red)}
.points{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #8a2be2;pointer-events:none;z-index:20;animation:float 1.6s ease forwards}
@keyframes float{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.tools{display:flex;justify-content:center;gap:8px;margin-top:12px}
.bigname{font-size:clamp(40px,12vw,64px);font-weight:900;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(255,200,61,.5)}
.bigav{font-size:90px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
.final-banner{display:none;padding:12px 18px;border-radius:14px;background:linear-gradient(90deg,var(--pink),#8a2be2);font-weight:900;letter-spacing:2px;animation:pulse 1s infinite}
.final-banner.show{display:block}
.board{display:flex;flex-direction:column;gap:10px;width:100%}
.brow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;overflow:hidden}
.brow .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,61,129,.35),rgba(138,43,226,.35));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.brow.lead .bar{background:linear-gradient(90deg,rgba(255,200,61,.45),rgba(255,138,0,.35))}
.brow > *:not(.bar){position:relative}
.brow .rk{font-weight:900;width:26px;color:var(--muted)}
.brow .av{font-size:26px}
.brow .nm{flex:1;font-weight:800;font-size:18px}
.brow .sc{font-weight:900;font-size:20px}
.crown{font-size:70px;animation:drop .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-120px) rotate(-30deg);opacity:0}}
#winnerName{opacity:0}
#winnerName.show{opacity:1;animation:zoom .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes zoom{from{transform:scale(.2)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.muted{color:var(--muted)}
.talk{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:25;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;transition:.25s;pointer-events:none}
.talk.on{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;left:14px;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:40;background:#ff4d4d;color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(-150%);transition:.35s}
.toast.show{transform:none}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="talk" id="talk">🎙️ The host is talking…</div>
<div class="toast" id="toast" onclick="this.classList.remove('show')"></div>
<div id="app">

 <!-- TITLE -->
 <section class="screen active" id="s-title">
  <div class="center">
   <div class="marquee"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
   <h1 class="logo">QUIZ<br>NIGHT</h1>
   <div class="tag">★ Showtime ★</div>
   <div class="marquee"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
   <p class="muted" style="max-width:320px">Turn the sound up! The host reads every question out loud.</p>
   <button class="btn" id="btnStart">🎬 Start the show</button>
  </div>
 </section>

 <!-- SETUP -->
 <section class="screen" id="s-setup">
  <h2>Who's playing tonight?</h2>
  <div class="card">
   <h3>Contestants</h3>
   <div id="playerList"></div>
   <button class="btn ghost small" id="btnAddPlayer">＋ Add player</button>
  </div>
  <div class="card">
   <h3>Game</h3>
   <div class="opt"><label for="selRounds">Questions each</label>
    <select id="selRounds"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div>
   <div class="opt"><label for="selTime">Seconds per question</label>
    <select id="selTime"><option>15</option><option selected>20</option><option>30</option></select></div>
  </div>
  <div class="card">
   <h3>Showtime</h3>
   <div class="opt"><label for="chkVoice">🎙️ Host reads questions</label><label class="switch"><input type="checkbox" id="chkVoice" checked><span></span></label></div>
   <div class="opt"><label for="selVoice">Host voice</label><select id="selVoice"><option value="">Default</option></select></div>
   <div class="opt"><label for="chkSound">🥁 Sound effects</label><label class="switch"><input type="checkbox" id="chkSound" checked><span></span></label></div>
   <div class="opt"><label for="chkMusic">🎵 Music</label><label class="switch"><input type="checkbox" id="chkMusic" checked><span></span></label></div>
   <button class="btn ghost small" id="btnTestVoice">🔊 Test the host</button>
  </div>
  <button class="btn pink" id="btnGo">Let's play! 🎉</button>
 </section>

 <!-- PASS -->
 <section class="screen" id="s-pass">
  <div class="center">
   <div class="final-banner" id="finalBanner">🔥 FINAL ROUND · DOUBLE POINTS 🔥</div>
   <div class="muted" style="font-size:18px">Pass the phone to</div>
   <div class="bigav" id="passAv">🦊</div>
   <div class="bigname" id="passName">Player</div>
   <div class="muted" id="passInfo"></div>
   <button class="btn" id="btnReady">I'm ready! 🙋</button>
  </div>
 </section>

 <!-- QUESTION -->
 <section class="screen" id="s-q">
  <div class="topbar">
   <span class="chip" id="qWho">🦊 Player</span>
   <span class="chip" id="qRound">Q 1/5</span>
   <span class="chip" id="qScore">0 pts</span>
  </div>
  <div class="catbox"><span class="cat" id="qCat">Category</span></div>
  <div class="timer" id="timer">
   <svg width="86" height="86"><circle class="bg" cx="43" cy="43" r="37"/><circle class="fg" id="timerFg" cx="43" cy="43" r="37"/></svg>
   <b id="timerNum">20</b>
  </div>
  <div class="question" id="qText"></div>
  <div class="answers" id="answers"></div>
  <div class="confirm" id="confirm">
   <button class="btn ghost" id="btnChange">↩ Change</button>
   <button class="btn pink" id="btnLock">🔒 Final answer!</button>
  </div>
  <div class="banner" id="banner"></div>
  <div class="tools" id="tools">
   <button class="btn ghost small" id="btnSkipRead">⏭ Skip reading</button>
   <button class="btn ghost small" id="btnRepeat">🔁 Read again</button>
  </div>
  <button class="btn" id="btnNext" style="display:none;margin-top:16px">Next ▶</button>
 </section>

 <!-- SCOREBOARD -->
 <section class="screen" id="s-board">
  <div class="center">
   <h2 id="boardTitle">Scoreboard</h2>
   <div class="board" id="board"></div>
   <button class="btn" id="btnBoardNext">Continue ▶</button>
  </div>
 </section>

 <!-- FINALE -->
 <section class="screen" id="s-final">
  <div class="center">
   <h2 id="finalTitle">And the winner is…</h2>
   <div id="winnerBox" style="min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div class="crown" id="crown" style="display:none">👑</div>
    <div class="bigname" id="winnerName"></div>
   </div>
   <div class="board" id="finalBoard" style="display:none"></div>
   <div id="finalBtns" style="display:none;width:100%;gap:10px;flex-direction:column">
    <button class="btn" id="btnAgain">🔁 Play again</button>
    <button class="btn ghost" id="btnNewPlayers">Change players</button>
   </div>
  </div>
 </section>
</div>

<script>
"use strict";
/* ---------------- QUESTIONS (first answer is the correct one; they get shuffled) ---------------- */
const QUESTIONS = [
 {c:"Geography",q:"What is the capital of Australia?",a:["Canberra","Sydney","Melbourne","Perth"]},
 {c:"Geography",q:"Which is the largest ocean on Earth?",a:["The Pacific","The Atlantic","The Indian Ocean","The Arctic"]},
 {c:"Geography",q:"Which is the smallest country in the world?",a:["Vatican City","Monaco","San Marino","Liechtenstein"]},
 {c:"Geography",q:"On which continent is Egypt?",a:["Africa","Asia","Europe","South America"]},
 {c:"Geography",q:"What is the capital of Canada?",a:["Ottawa","Toronto","Vancouver","Montreal"]},
 {c:"Geography",q:"Mount Everest sits on the border between Nepal and which other country?",a:["China","India","Bhutan","Pakistan"]},
 {c:"Geography",q:"Which country has the most people in the world?",a:["India","China","USA","Indonesia"]},
 {c:"Iceland",q:"What is the largest glacier in Iceland?",a:["Vatnajökull","Langjökull","Hofsjökull","Mýrdalsjökull"]},
 {c:"Iceland",q:"What is the name of Iceland's parliament?",a:["Alþingi","Storting","Riksdag","Folketing"]},
 {c:"Iceland",q:"In which year was the Alþingi founded?",a:["930","1262","1550","1874"]},
 {c:"Iceland",q:"In which year did Iceland become a republic?",a:["1944","1918","1874","1955"]},
 {c:"Iceland",q:"What is the highest mountain in Iceland?",a:["Hvannadalshnúkur","Hekla","Herðubreið","Snæfell"]},
 {c:"Iceland",q:"Which volcano erupted in 2010 and stopped flights all over Europe?",a:["Eyjafjallajökull","Katla","Hekla","Grímsvötn"]},
 {c:"Iceland",q:"How many Yule Lads are there?",a:["13","9","12","24"]},
 {c:"Iceland",q:"What kind of bird is a lundi?",a:["A puffin","A seagull","A raven","An eagle"]},
 {c:"Iceland",q:"What is the longest river in Iceland?",a:["Þjórsá","Ölfusá","Hvítá","Jökulsá á Fjöllum"]},
 {c:"Iceland",q:"What is skyr?",a:["A dairy product","A type of fish","A kind of bread","A lamb stew"]},
 {c:"Science",q:"Which planet is closest to the Sun?",a:["Mercury","Venus","Mars","Earth"]},
 {c:"Science",q:"What is H2O better known as?",a:["Water","Salt","Hydrogen gas","Oxygen"]},
 {c:"Science",q:"How many bones does an adult human have?",a:["206","186","226","300"]},
 {c:"Science",q:"What is the largest planet in our solar system?",a:["Jupiter","Saturn","Neptune","Earth"]},
 {c:"Science",q:"Which gas do plants take in from the air?",a:["Carbon dioxide","Oxygen","Nitrogen","Helium"]},
 {c:"Science",q:"What is the hardest natural substance?",a:["Diamond","Gold","Iron","Quartz"]},

 {c:"Science",q:"Which planet is known as the Red Planet?",a:["Mars","Jupiter","Venus","Mercury"]},
 {c:"Science",q:"Roughly how fast does light travel?",a:["300,000 km per second","30,000 km per second","3,000 km per second","3 million km per second"]},
 {c:"Animals",q:"What is the fastest land animal?",a:["The cheetah","The lion","The horse","The greyhound"]},
 {c:"Animals",q:"What is the largest animal alive today?",a:["The blue whale","The African elephant","The giraffe","The great white shark"]},
 {c:"Animals",q:"How many legs does a spider have?",a:["8","6","10","12"]},
 {c:"Animals",q:"What is a baby kangaroo called?",a:["A joey","A kit","A cub","A calf"]},
 {c:"Animals",q:"Which of these mammals can truly fly?",a:["The bat","The flying squirrel","The penguin","The ostrich"]},
 {c:"Animals",q:"How many hearts does an octopus have?",a:["3","1","2","8"]},
 {c:"Sports",q:"How many players does a football team have on the pitch?",a:["11","10","9","12"]},
 {c:"Sports",q:"Iceland reached the quarter-finals of which tournament in 2016?",a:["Euro 2016","World Cup 2014","Euro 2012","World Cup 2018"]},
 {c:"Sports",q:"How many rings are on the Olympic flag?",a:["5","4","6","7"]},
 {c:"Sports",q:"In tennis, what is a score of zero called?",a:["Love","Nil","Duck","Zip"]},
 {c:"Sports",q:"Which Premier League club is nicknamed the Red Devils?",a:["Manchester United","Liverpool","Arsenal","Nottingham Forest"]},

 {c:"Food",q:"What is the main ingredient in guacamole?",a:["Avocado","Peas","Cucumber","Spinach"]},
 {c:"Food",q:"Which country does pizza Margherita come from?",a:["Italy","Greece","Spain","France"]},
 {c:"Food",q:"Which fruit is dried to make raisins?",a:["Grapes","Plums","Cherries","Figs"]},
 {c:"Everything",q:"How many days are there in a leap year?",a:["366","365","364","367"]},
 {c:"Everything",q:"How many colours are there in a rainbow?",a:["7","6","8","5"]},
 {c:"Everything",q:"Which language has the most native speakers?",a:["Mandarin Chinese","English","Spanish","Hindi"]},
 {c:"Everything",q:"Who painted the Mona Lisa?",a:["Leonardo da Vinci","Michelangelo","Pablo Picasso","Vincent van Gogh"]},
 {c:"Everything",q:"How many minutes are there in a day?",a:["1,440","1,200","1,600","1,240"]},
 {c:"Everything",q:"What do you call a shape with six sides?",a:["A hexagon","A pentagon","An octagon","A heptagon"]},
 {c:"Everything",q:"How many continents are there?",a:["7","5","6","8"]}
];
const CAT_COLORS={Geography:"#2f9bff",Iceland:"#33c3ff",Science:"#2ee59d",Animals:"#ff9f1c",Sports:"#ff3d81",Music:"#b45cff",Food:"#ff6b3d",Everything:"#ffc83d"};
const AVATARS=["🦊","🐧","🦁","🐙","🦄","🐸"];
const LETTERS=["A","B","C","D"];

/* ---------------- STATE ---------------- */
const S={players:[],perPlayer:5,secs:20,turn:0,flow:0,phase:"idle",used:new Set(),cur:null,picked:-1,timeLeft:0,timerId:null,
 voiceOn:true,soundOn:true,musicOn:true,voice:null};
const $=id=>document.getElementById(id);
const rand=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));window.scrollTo(0,0)}

/* ---------------- SOUND (all made in the browser, no files needed) ---------------- */
let AC=null,master=null,noiseBuf=null;
function ac(){
 if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 if(AC.state==="suspended")AC.resume();return AC;
}
function tone(f,d,o={}){const a=ac();if(!a||!S.soundOn)return;const{type="sine",vol=.25,when=0,slide=null,attack=.01,vib=0,at=null,out=null}=o;
 const t=at!=null?at:a.currentTime+when,osc=a.createOscillator(),g=a.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t);
 if(slide)osc.frequency.exponentialRampToValueAtTime(slide,t+d);
 if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=6;lg.gain.value=vib;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+.1)}
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.setValueAtTime(vol,t+Math.max(attack,d*.6));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 osc.connect(g);g.connect(out||master);osc.start(t);osc.stop(t+d+.05);}
function noise(d,o={}){const a=ac();if(!a||!S.soundOn)return;const{vol=.2,when=0,freq=1000,to=null,q=1,type="bandpass",attack=.005,at=null,out=null}=o;
 const t=at!=null?at:a.currentTime+when,src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=noiseBuf;
 f.type=type;f.frequency.setValueAtTime(freq,t);if(to)f.frequency.exponentialRampToValueAtTime(to,t+d);f.Q.value=q;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 src.connect(f);f.connect(g);g.connect(out||master);src.start(t,Math.random());src.stop(t+d+.05);}
const SFX={
 tick(hi){tone(hi?1900:1500,.035,{type:"square",vol:.07})},
 heart(){tone(62,.16,{vol:.7});tone(55,.18,{vol:.55,when:.2})},
 whoosh(){noise(.5,{vol:.25,freq:400,to:4000,q:2})},
 spin(){tone(700+Math.random()*700,.04,{type:"triangle",vol:.12})},
 reveal(){tone(523,.12,{type:"triangle",vol:.2});tone(784,.2,{type:"triangle",vol:.2,when:.1})},
 buzzer(){tone(140,.8,{type:"sawtooth",vol:.2});tone(147,.8,{type:"sawtooth",vol:.2})},
 drumroll(sec){const n=Math.floor(sec/.045);for(let i=0;i<n;i++){const p=i/n;noise(.06,{vol:.04+.22*p*p,when:i*.045,freq:1800+600*p,q:.7})}
  noise(1.3,{vol:.45,when:sec,freq:6000,type:"highpass",q:.3});tone(70,.35,{vol:.8,when:sec,slide:40})},
 fanfare(){[523,659,784].forEach((f,i)=>{tone(f,.14,{type:"square",vol:.09,when:i*.11});tone(f,.14,{type:"triangle",vol:.15,when:i*.11})});
  [523,659,784,1047].forEach(f=>{tone(f,.8,{type:"triangle",vol:.12,when:.36,vib:4});tone(f,.8,{type:"square",vol:.04,when:.36})})},
 cheer(){for(let i=0;i<70;i++)noise(.08+Math.random()*.1,{vol:.05+Math.random()*.12,when:Math.random()*1.9,freq:1500+Math.random()*2500,q:1.2});
  noise(2,{vol:.08,freq:900,q:.5,attack:.3})},
 trombone(){const n=[[233,.42],[220,.42],[208,.42],[196,1.3]];let w=0;n.forEach(([f,d],i)=>{tone(f,d,{type:"sawtooth",vol:.13,when:w,attack:.04,vib:i===3?7:0,slide:i===3?185:null});w+=d+.04})},
 jingle(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.16,{type:"triangle",vol:.18,when:i*.09}));setTimeout(()=>SFX.fanfare(),520)},
 fire(){noise(.8,{vol:.3,freq:300,to:2500,q:1});tone(300,.6,{type:"sawtooth",vol:.08,slide:900})}
};


/* ---------------- MUSIC (generated live, loops) ---------------- */
let mTimer=null,mGain=null,mMode=null,mStep=0,mNext=0,mDuck=false;
const mVol=()=>(mMode==="tension"?.55:.42)*(mDuck?.35:1);
function musicStart(mode){if(mMode===mode)return;musicStop();const a=ac();if(!a||!S.soundOn||!S.musicOn)return;
 mMode=mode;mStep=0;mNext=a.currentTime+.06;mGain=a.createGain();mGain.gain.value=0;mGain.connect(master);mGain.gain.setTargetAtTime(mVol(),a.currentTime,.3);
 mTimer=setInterval(()=>{if(!mGain)return;while(mNext<a.currentTime+.2){playStep(mStep,mNext);mStep++;mNext+=stepLen()}},40)}
function musicStop(){clearInterval(mTimer);mTimer=null;if(mGain&&AC){const g=mGain;g.gain.setTargetAtTime(0,AC.currentTime,.06);setTimeout(()=>{try{g.disconnect()}catch(e){}},600)}mGain=null;mMode=null}
function duck(on){mDuck=on;if(mGain&&AC)mGain.gain.setTargetAtTime(mVol(),AC.currentTime,.15)}
function stepLen(){if(mMode==="tension")return S.timeLeft<=5&&S.phase==="timing"?60/160/2:60/122/2;return 60/116/2}
function playStep(i,t){const o=mGain;
 if(mMode==="tension"){
  const danger=S.timeLeft<=5&&S.phase==="timing";
  const roots=[110,87.31,73.42,82.41],root=roots[Math.floor(i/16)%4],st=i%16;
  tone(st%2?root*2:root,.16,{type:"sawtooth",vol:.07,at:t,out:o});tone(st%2?root*2:root,.16,{type:"triangle",vol:.16,at:t,out:o});
  if(st%4===0)tone(95,.22,{vol:.55,at:t,out:o,slide:42});
  noise(st%2?.06:.03,{vol:st%2?.07:.035,at:t,out:o,freq:8000,type:"highpass",q:.5});
  if(st%8===4)noise(.12,{vol:.12,at:t,out:o,freq:1800,q:.8});
  if(st===0){[1,1.189,1.498].forEach(m=>tone(root*2*m,1.9,{type:"triangle",vol:.05,at:t,out:o,attack:.3,vib:3}))}
  if(danger){tone(root*4*(st%2?1.498:1),.1,{type:"square",vol:.04,at:t,out:o})}
 }else{
  const prog=[[130.81,[1,1.26,1.498]],[110,[1,1.189,1.498]],[87.31,[1,1.26,1.498]],[98,[1,1.26,1.498]]];
  const [root,ch]=prog[Math.floor(i/8)%4],st=i%8;
  if(st%2===0)tone(st===4?root*1.498:root,.28,{type:"triangle",vol:.22,at:t,out:o});
  if(st%2===1)ch.forEach(m=>tone(root*2*m,.14,{type:"square",vol:.025,at:t,out:o}));
  if(st%4===0)tone(90,.2,{vol:.45,at:t,out:o,slide:45});
  if(st===2||st===6)noise(.1,{vol:.09,at:t,out:o,freq:2000,q:.8});
  noise(.04,{vol:.04,at:t,out:o,freq:9000,type:"highpass"});
  const mel=[0,0,7,0,5,0,4,0, 0,0,3,0,7,0,0,0];const n=mel[i%16];if(n&&Math.floor(i/16)%2===1)tone(root*4*Math.pow(2,n/12),.2,{type:"triangle",vol:.06,at:t,out:o});
 }}
/* ---------------- HOST VOICE (built into the browser) ---------------- */
const canSpeak="speechSynthesis" in window;
let voices=[];
function loadVoices(){if(!canSpeak)return;voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
 const sel=$("selVoice"),keep=sel.value;sel.innerHTML='<option value="">Default</option>';
 voices.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name.replace(/Microsoft |Google /,"")+" ("+v.lang+")";sel.appendChild(o)});
 let saved=null;try{saved=localStorage.getItem("qn_voice")}catch(e){}
 const idx=voices.findIndex(v=>v.name===saved);
 if(idx>=0)sel.value=idx;else if(keep)sel.value=keep;else{const pref=voices.findIndex(v=>/en-GB/i.test(v.lang)&&/Daniel|Arthur|Male|George/i.test(v.name));if(pref>=0)sel.value=pref;}
 S.voice=sel.value===""?null:voices[+sel.value];}
if(canSpeak){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
let lastHush=0,speechWorked=false,warned=false;
function makeUtt(text,rate=1.02,pitch=1){const u=new SpeechSynthesisUtterance(text);if(S.voice){u.voice=S.voice;u.lang=S.voice.lang}else u.lang="en-GB";
 u.rate=rate;u.pitch=pitch;u.volume=1;window._utt=u;return u}// keep a reference so the phone doesn't drop it
function warnNoVoice(){if(warned||speechWorked)return;warned=true;const t=$("toast");
 t.innerHTML="🔇 The host can't talk on this phone.<br>Turn off silent mode, turn the volume up, and open the link in <b>Safari</b> or <b>Chrome</b> (not inside another app).";
 t.classList.add("show");setTimeout(()=>t.classList.remove("show"),9000)}
function sayOne(text,{rate=1.02,pitch=1}={}){return new Promise(res=>{
 if(!S.voiceOn||!canSpeak||!text){res();return}
 const u=makeUtt(text,rate,pitch);let done=false,started=false;
 const fin=()=>{if(done)return;done=true;clearTimeout(t);$("talk").classList.remove("on");duck(false);res()};
 u.onstart=()=>{started=true;speechWorked=true;$("talk").classList.add("on");duck(true)};u.onend=fin;u.onerror=fin;
 const t=setTimeout(fin,2500+text.length*85/rate);
 setTimeout(()=>{if(!started&&!done)warnNoVoice()},3000);
 const go=()=>{try{speechSynthesis.resume()}catch(e){}speechSynthesis.speak(u)};
 const since=Date.now()-lastHush;if(since<200)setTimeout(go,200-since);else go();});}
let speechGen=0;
async function say(parts,opts){const g=speechGen;for(const p of [].concat(parts)){if(g!==speechGen)break;await sayOne(p,opts)}}
function hush(){speechGen++;if(canSpeak){speechSynthesis.cancel();lastHush=Date.now()}$("talk").classList.remove("on")}

const LINES={
 up:["{n}, you're up!","Next up, {n}!","{n}, the spotlight is on you!","Here comes {n}!","{n}, are you ready?"],
 right:["Correct! Brilliant!","Yes! That's right!","Absolutely correct!","Spot on!","Ding ding ding! Correct!","You nailed it!"],
 wrong:["Oh no! So close!","Ooh, that's not it!","Oh dear, wrong answer!","Unlucky!"],
 lock:["Is that your final answer? … Locked in!","Final answer… let's see!","Locked in. The moment of truth…"],
 timeup:["Time's up!","Oh no, the clock ran out!"],
 fire:["{n} is on fire! Three in a row!","Unstoppable! {n} is on fire!"]
};
const line=(k,n="")=>rand(LINES[k]).replace("{n}",n);

/* ---------------- CONFETTI ---------------- */
const cv=$("confetti"),cx=cv.getContext("2d");let parts=[],raf=0;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",resize);resize();
function confetti(n=140){const cols=["#ffc83d","#ff3d81","#33e1ff","#2ee59d","#b45cff","#fff"];
 for(let i=0;i<n;i++)parts.push({x:cv.width*(.2+Math.random()*.6),y:cv.height*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*16-6)*devicePixelRatio,
  s:(6+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:rand(cols),life:0});
 if(!raf)raf=requestAnimationFrame(tick);}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
 parts.forEach(p=>{p.vy+=.45*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
 parts=parts.filter(p=>p.y<cv.height+40&&p.life<400);raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* ---------------- SETUP ---------------- */
function loadSaved(){try{const d=JSON.parse(localStorage.getItem("qn_setup")||"null");if(d)return d}catch(e){}return null}
function save(){try{localStorage.setItem("qn_setup",JSON.stringify({names:readNames(),per:$("selRounds").value,secs:$("selTime").value,voice:$("chkVoice").checked,sound:$("chkSound").checked,music:$("chkMusic").checked}));
 if(S.voice)localStorage.setItem("qn_voice",S.voice.name)}catch(e){}}
function renderPlayers(names){const box=$("playerList");box.innerHTML="";
 names.forEach((n,i)=>{const r=document.createElement("div");r.className="prow";
  r.innerHTML=`<span class="av">${AVATARS[i]}</span><input maxlength="14" placeholder="Player ${i+1}" value="${n.replace(/"/g,"&quot;")}"><button aria-label="Remove">✕</button>`;
  r.querySelector("button").onclick=()=>{const cur=readNames();if(cur.length>1){cur.splice(i,1);renderPlayers(cur)}};box.appendChild(r)});
 $("btnAddPlayer").style.display=names.length>=6?"none":"";}
function readNames(){return[...document.querySelectorAll("#playerList input")].map(i=>i.value.trim())}
(function initSetup(){const d=loadSaved();renderPlayers(d&&d.names&&d.names.length?d.names:["",""]);
 if(d){$("selRounds").value=d.per||"5";$("selTime").value=d.secs||"20";$("chkVoice").checked=d.voice!==false;$("chkSound").checked=d.sound!==false;$("chkMusic").checked=d.music!==false}
 if(!canSpeak){$("chkVoice").checked=false;$("chkVoice").disabled=true}})();
$("btnAddPlayer").onclick=()=>{const n=readNames();if(n.length<6){n.push("");renderPlayers(n)}};
$("selVoice").onchange=()=>{S.voice=$("selVoice").value===""?null:voices[+$("selVoice").value]};
$("chkVoice").onchange=e=>{S.voiceOn=e.target.checked;if(!S.voiceOn)hush()};
$("chkSound").onchange=e=>{S.soundOn=e.target.checked;if(!S.soundOn)musicStop();else musicStart("theme")};
$("chkMusic").onchange=e=>{S.musicOn=e.target.checked;if(!S.musicOn)musicStop();else musicStart("theme")};
$("btnTestVoice").onclick=()=>{ac();S.voiceOn=true;$("chkVoice").checked=true;if(!canSpeak){warnNoVoice();return}
 speechSynthesis.cancel();warned=false;speechWorked=false;const u=makeUtt("Good evening, and welcome to Quiz Night!");
 u.onstart=()=>{speechWorked=true};setTimeout(()=>{if(!speechWorked)warnNoVoice()},3000);speechSynthesis.speak(u)};

$("btnStart").onclick=async()=>{ac();S.soundOn=$("chkSound").checked;S.voiceOn=$("chkVoice").checked;
 // Phones only allow talking if the first speech starts right inside a tap, so speak immediately here
 if(canSpeak&&S.voiceOn){loadVoices();speechSynthesis.cancel();const u=makeUtt("Ladies and gentlemen, welcome to Quiz Night! Who's playing tonight?");
  u.onstart=()=>{speechWorked=true};setTimeout(()=>{if(!speechWorked)warnNoVoice()},3500);speechSynthesis.speak(u)}
 S.musicOn=$("chkMusic").checked;SFX.jingle();show("s-setup");setTimeout(()=>musicStart("theme"),1500);};

$("btnGo").onclick=()=>{ac();hush();
 const names=readNames().map((n,i)=>n||("Player "+(i+1)));
 S.players=names.map((n,i)=>({name:n,av:AVATARS[i],score:0,streak:0,right:0}));
 S.perPlayer=+$("selRounds").value;S.secs=+$("selTime").value;S.voiceOn=$("chkVoice").checked;S.soundOn=$("chkSound").checked;S.musicOn=$("chkMusic").checked;S.turn=0;
 save();startPass();};

/* ---------------- GAME FLOW ---------------- */
const totalTurns=()=>S.players.length*S.perPlayer;
const curPlayer=()=>S.players[S.turn%S.players.length];
const roundNo=()=>Math.floor(S.turn/S.players.length)+1;
const isFinal=()=>roundNo()===S.perPlayer&&S.perPlayer>1;

async function startPass(){
 const p=curPlayer(),id=++S.flow;show("s-pass");
 $("passAv").textContent=p.av;$("passName").textContent=p.name;
 $("passInfo").textContent=`Question ${roundNo()} of ${S.perPlayer} · ${p.score} points`;
 const fin=isFinal()&&S.turn%S.players.length===0;$("finalBanner").classList.toggle("show",isFinal());
 SFX.whoosh();hush();if(!fin)musicStart("theme");
 if(fin){musicStop();SFX.drumroll(1.2);await sleep(1300);if(id!==S.flow)return;SFX.fanfare();await say("This is it! The final round! Every answer is worth double points!");if(id!==S.flow)return;musicStart("theme")}
 say(S.players.length>1?line("up",p.name):"Here's your next question!");
}
$("btnReady").onclick=()=>{ac();hush();if(canSpeak){try{speechSynthesis.resume()}catch(e){}}startQuestion()};

function pickQuestion(){let pool=QUESTIONS.map((q,i)=>i).filter(i=>!S.used.has(i));if(!pool.length){S.used.clear();pool=QUESTIONS.map((q,i)=>i)}
 const i=rand(pool);S.used.add(i);const q=QUESTIONS[i];const order=[0,1,2,3].sort(()=>Math.random()-.5);
 return{c:q.c,q:q.q,a:order.map(k=>q.a[k]),correct:order.indexOf(0)};}

function readText(q){return[q.q,q.a.map((a,i)=>LETTERS[i]+": "+a+".").join(" … ")]}

async function startQuestion(){
 const id=++S.flow,p=curPlayer();S.phase="intro";S.picked=-1;stopTimer();
 const q=S.cur=pickQuestion();show("s-q");
 $("qWho").textContent=p.av+" "+p.name;$("qRound").textContent=`Q ${roundNo()}/${S.perPlayer}`;$("qScore").textContent=p.score+" pts";
 $("qRound").className="chip"+(isFinal()?" gold":"");if(isFinal())$("qRound").textContent="2× FINAL";
 $("qText").textContent="";$("answers").innerHTML="";$("banner").textContent="";$("banner").className="banner";
 $("confirm").classList.remove("show");$("btnNext").style.display="none";$("tools").style.display="flex";
 setTimer(S.secs,S.secs);musicStop();setTimeout(()=>{if(id===S.flow)musicStart("tension")},300);
 // category spinner
 const cat=$("qCat"),cats=Object.keys(CAT_COLORS);cat.classList.add("spin");
 for(let i=0;i<14;i++){const c=i===13?q.c:rand(cats);cat.textContent=c;cat.style.background=CAT_COLORS[c];SFX.spin();await sleep(50+i*9);if(id!==S.flow)return}
 cat.classList.remove("spin");SFX.reveal();
 await sleep(250);if(id!==S.flow)return;
 $("qText").textContent=q.q;
 q.a.forEach((a,i)=>{const b=document.createElement("button");b.className="ans";b.innerHTML=`<span class="L">${LETTERS[i]}</span><span></span>`;b.lastChild.textContent=a;
  b.onclick=()=>pick(i);$("answers").appendChild(b);setTimeout(()=>b.classList.add("in"),120+i*140)});
 S.phase="reading";S.timeLeft=S.secs;
 await say(readText(q));if(id!==S.flow)return;
 if(S.phase==="reading")startTimer();
}
$("btnSkipRead").onclick=()=>{hush()};
$("btnRepeat").onclick=async()=>{if(!S.cur||S.phase==="reveal"||S.phase==="done")return;const id=S.flow;const wasTiming=S.phase==="timing";
 if(wasTiming){stopTimer();S.phase="reading"}hush();await sleep(80);await say(readText(S.cur));if(id===S.flow&&S.phase==="reading")startTimer()};

function setTimer(left,total){const c=2*Math.PI*37,fg=$("timerFg");fg.style.strokeDasharray=c;fg.style.strokeDashoffset=c*(1-left/total);$("timerNum").textContent=left;
 const danger=left<=5&&S.phase==="timing";$("timer").classList.toggle("danger",danger);document.body.classList.toggle("tense",danger)}
function startTimer(){S.phase="timing";stopTimer();setTimer(S.timeLeft,S.secs);
 S.timerId=setInterval(()=>{S.timeLeft--;setTimer(S.timeLeft,S.secs);
  if(S.timeLeft<=0){stopTimer();timeUp();return}
  if(S.timeLeft<=5)SFX.heart();SFX.tick(S.timeLeft%2===0);
  if(S.timeLeft===5)say("Five seconds!",{rate:1.2})},1000)}
function stopTimer(){clearInterval(S.timerId);S.timerId=null;document.body.classList.remove("tense");$("timer").classList.remove("danger")}

function pick(i){if(!["reading","timing","confirm"].includes(S.phase))return;hush();stopTimer();musicStop();S.phase="confirm";S.picked=i;
 [...$("answers").children].forEach((b,k)=>b.classList.toggle("picked",k===i));SFX.tick(true);$("confirm").classList.add("show");$("tools").style.display="none"}
$("btnChange").onclick=()=>{if(S.phase!=="confirm")return;S.picked=-1;[...$("answers").children].forEach(b=>b.classList.remove("picked"));$("confirm").classList.remove("show");$("tools").style.display="flex";musicStart("tension");startTimer()};
$("btnLock").onclick=async()=>{if(S.phase!=="confirm")return;S.phase="reveal";const id=S.flow;$("confirm").classList.remove("show");
 const btns=[...$("answers").children];btns.forEach(b=>b.disabled=true);btns[S.picked].classList.add("suspense");
 await say(rand(LINES.lock),{rate:.95});if(id!==S.flow)return;
 SFX.drumroll(2.2);await sleep(2300);if(id!==S.flow)return;btns[S.picked].classList.remove("suspense");reveal(S.picked===S.cur.correct)};

function timeUp(){if(S.phase!=="timing")return;S.phase="reveal";hush();musicStop();SFX.buzzer();[...$("answers").children].forEach(b=>b.disabled=true);
 $("tools").style.display="none";setTimeout(()=>reveal(false,true),700)}

async function reveal(ok,timeout=false){const id=S.flow,p=curPlayer(),q=S.cur,btns=[...$("answers").children];
 btns.forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add("right");else if(k===S.picked)b.classList.add("wrong");else b.classList.add("dim")});
 const ban=$("banner");
 if(ok){
  p.streak++;p.right++;let pts=100+S.timeLeft*5;if(isFinal())pts*=2;let fire=p.streak===3||p.streak===6;if(fire)pts+=50;p.score+=pts;
  $("qScore").textContent=p.score+" pts";ban.className="banner good";ban.textContent=fire?`🔥 ON FIRE! +${pts}`:`Correct! +${pts}`;
  SFX.fanfare();SFX.cheer();confetti();const f=document.createElement("div");f.className="points";f.textContent="+"+pts;document.body.appendChild(f);setTimeout(()=>f.remove(),1700);
  await say(line("right"));if(id!==S.flow)return;
  if(fire){SFX.fire();await say(line("fire",p.name));}
 }else{
  p.streak=0;ban.className="banner bad";ban.textContent=timeout?"⏰ Time's up!":"Wrong answer!";$("s-q").classList.add("shake");setTimeout(()=>$("s-q").classList.remove("shake"),600);
  SFX.trombone();await sleep(400);if(id!==S.flow)return;
  await say((timeout?line("timeup"):line("wrong"))+" The right answer was "+q.a[q.correct]+".");
 }
 if(id!==S.flow)return;S.phase="done";$("btnNext").style.display="block";
}
$("btnNext").onclick=()=>{hush();S.turn++;
 if(S.turn>=totalTurns())return finale();
 if(S.turn%S.players.length===0&&S.players.length>1)return scoreboard();
 if(S.players.length===1&&S.turn%3===0)return scoreboard();
 startPass()};

/* ---------------- SCOREBOARD ---------------- */
function renderBoard(el,animate=true){const list=[...S.players].sort((a,b)=>b.score-a.score),max=Math.max(1,list[0].score);el.innerHTML="";
 list.forEach((p,i)=>{const r=document.createElement("div");r.className="brow"+(i===0&&p.score>0?" lead":"");
  r.innerHTML=`<div class="bar"></div><span class="rk">${i+1}</span><span class="av">${p.av}</span><span class="nm"></span><span class="sc">${p.score}</span>`;r.querySelector(".nm").textContent=p.name;
  el.appendChild(r);const w=Math.max(4,p.score/max*100)+"%";if(animate)setTimeout(()=>r.querySelector(".bar").style.width=w,150+i*200);else r.querySelector(".bar").style.width=w});
 return list;}
async function scoreboard(){const id=++S.flow;show("s-board");$("boardTitle").textContent=`After round ${S.turn/S.players.length|0}`;
 const list=renderBoard($("board"));SFX.whoosh();musicStart("theme");await sleep(500);if(id!==S.flow)return;
 let msg;if(S.players.length===1)msg=`You have ${list[0].score} points. Keep going!`;
 else if(list[0].score===list[1].score)msg="It's neck and neck at the top! Anything can happen!";
 else msg=`${list[0].name} is in the lead with ${list[0].score} points!`+(list[0].score-list[1].score<150?" But it's very close!":"");
 say(msg);}
$("btnBoardNext").onclick=()=>{hush();startPass()};

/* ---------------- FINALE ---------------- */
async function finale(){const id=++S.flow;show("s-final");musicStop();
 $("crown").style.display="none";$("winnerName").className="bigname";$("winnerName").textContent="";$("finalBoard").style.display="none";$("finalBtns").style.display="none";
 const list=[...S.players].sort((a,b)=>b.score-a.score),top=list[0].score,winners=list.filter(p=>p.score===top);
 $("finalTitle").textContent=S.players.length>1?"And the winner is…":"Final score…";
 await say(S.players.length>1?"The scores are in. And the winner of Quiz Night is…":"That's the end of the show! Your final score is…",{rate:.92});if(id!==S.flow)return;
 SFX.drumroll(3);await sleep(3100);if(id!==S.flow)return;
 const names=winners.map(w=>w.name).join(" & ");
 $("crown").style.display="block";$("winnerName").textContent=S.players.length>1?names:top+" pts";$("winnerName").classList.add("show");
 SFX.fanfare();SFX.cheer();confetti(220);setTimeout(()=>confetti(160),700);setTimeout(()=>confetti(160),1500);
 $("finalBoard").style.display="flex";renderBoard($("finalBoard"));
 if(S.players.length===1)await say(`${top} points! Great job!`);
 else if(winners.length>1)await say(`It's a tie! ${names}! You are both champions tonight!`);
 else await say(`${names}! Congratulations, you are the Quiz Night champion!`);
 if(id!==S.flow)return;$("finalBtns").style.display="flex";musicStart("theme");}
$("btnAgain").onclick=()=>{hush();S.players.forEach(p=>{p.score=0;p.streak=0;p.right=0});S.turn=0;startPass()};
$("btnNewPlayers").onclick=()=>{hush();++S.flow;show("s-setup")};
</script>
